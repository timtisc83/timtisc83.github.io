<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobiltelefone sortieren | ODCE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--t:#00C1D4;--b:#143AFF;--g:#D0D0CE;--ok:#5AFFC5;--no:#FF4F4F}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,sans-serif;color:#000;background:#fff}
header{display:flex;align-items:center;gap:20px;padding:20px 5vw;border-bottom:3px solid var(--t)}
header svg{width:115px;height:auto;flex:0 0 auto}
header .inst{font-size:.85rem;font-weight:300;line-height:1.3;flex:1}
.lang{display:flex;border:2px solid var(--b)}
.lang button{margin:0;padding:6px 12px;border:0;background:#fff;color:var(--b);font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--b);color:#fff}
main{padding:30px 5vw 60px}
h1{font-weight:700;font-size:clamp(1.6rem,3.5vw,2.6rem);margin:0 0 6px}
h1 span{color:var(--t)}
.lead{font-weight:300;margin:0 0 24px;max-width:60ch}
.task{border-left:4px solid var(--b);padding:8px 14px;background:#f4fdfe;margin-bottom:24px;max-width:70ch}
.frame{border:2px dashed var(--t);padding:14px;position:relative}
.tag{position:absolute;top:-12px;background:#fff;padding:0 6px;font-size:.8rem;font-weight:600;color:var(--b)}
.tag.l{left:12px}.tag.r{right:12px}
.row{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}
.card{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--g);padding:6px;cursor:grab;transition:border-color .15s,transform .15s;user-select:none}
.card img{width:96px;height:190px;object-fit:contain;pointer-events:none}
.card:hover{border-color:var(--t)}
.card.sel{border-color:var(--b);transform:translateY(-6px)}
.card.drag{opacity:.4}
.card.ok{border-color:var(--ok);background:#effff9}
.card.no{border-color:var(--no);background:#fff3f3}
.card .n{font-size:.75rem;font-weight:600;height:1.1em;color:var(--b)}
.card:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
button{font:600 .95rem Poppins,sans-serif;padding:10px 20px;border:2px solid var(--b);background:var(--b);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--b)}
button:hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid var(--t);outline-offset:2px}
#score{margin-top:18px;font-weight:600;min-height:1.4em}
#original{display:none;margin-top:36px}
#original h2{font-size:1.3rem;margin:0 0 10px;border-bottom:2px solid var(--t);display:inline-block}
#original .card{cursor:default}
footer{padding:16px 5vw;font-size:.75rem;font-weight:300;border-top:1px dotted var(--g)}
@media (max-width:560px){header{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
<svg role="img" aria-label="ODCE Logo" viewBox="0 0 96.605103 82.199448" xmlns="http://www.w3.org/2000/svg"><g transform="translate(117.23172,-149.41432)"><path style="fill:none;stroke:#143aff;stroke-width:1.5875;stroke-linecap:round;stroke-linejoin:round" d="m -116.43796,230.55898 59.621691,0.26104 h 6.8089 l 27.00638,-23.65599 v -50.64865 l -38.93207,0.22247 -54.504901,21.22023 z"/><g style="fill:#143aff"><path d="m -102.06223,223.39662 c 4.504274,0 7.270058,-2.6275 7.270058,-7.32933 0,-4.70183 -2.765784,-7.32933 -7.270058,-7.32933 -4.52404,0 -7.28982,2.6275 -7.28982,7.32933 0,4.70183 2.76578,7.32933 7.28982,7.32933 z m 0,-3.14114 c -2.23239,0 -3.65479,-1.56069 -3.65479,-4.18819 0,-2.62749 1.4224,-4.18819 3.65479,-4.18819 2.212624,0 3.635027,1.5607 3.635027,4.18819 0,2.6275 -1.422403,4.18819 -3.635027,4.18819 z"/><path d="m -93.783207,223.12004 h 6.183503 c 3.753564,0 6.795927,-1.89654 6.795927,-7.05275 0,-5.15621 -3.042363,-7.05275 -6.795927,-7.05275 h -6.183503 z m 5.294501,-3.12138 h -1.857026 v -7.86273 h 1.857026 c 3.239919,0 4.049898,1.34338 4.049898,3.93136 0,2.58799 -0.809979,3.93137 -4.049898,3.93137 z"/><path d="m -73.05818,223.39662 c 3.101629,0 6.440326,-1.81752 6.637882,-5.84766 h -3.654786 c -0.217312,1.85703 -1.698982,2.70652 -2.983096,2.70652 -2.15336,0 -3.496741,-1.44216 -3.496741,-4.20794 0,-2.72628 1.343381,-4.16844 3.496741,-4.16844 1.284114,0 2.78554,0.82974 2.983096,2.70652 h 3.654786 c -0.197556,-4.0499 -3.536253,-5.84766 -6.637882,-5.84766 -4.286965,0 -7.131771,2.54848 -7.131771,7.30958 0,4.80061 2.844806,7.34908 7.131771,7.34908 z"/><path d="m -65.411352,223.12004 h 10.806313 v -3.12138 h -7.368838 v -2.37068 h 6.381058 v -3.12138 h -6.381058 v -2.37067 h 7.27006 v -3.12139 h -10.707535 z"/></g></g></svg>
<div class="inst">Institute for Organizational Design<br>and Collaboration Engineering<br>TU Hamburg</div>
<div class="lang" role="group" aria-label="Language / Sprache">
<button data-set="de" aria-pressed="true">DE</button><button data-set="en" aria-pressed="false">EN</button>
</div>
</header>
<main>
<h1><span data-i="t1"></span> <span data-i="t2"></span></h1>
<p class="lead" data-i="lead"></p>
<div class="task" data-i="task"></div>
<div class="frame"><span class="tag l" data-i="old"></span><span class="tag r" data-i="new"></span><div class="row" id="row"></div></div>
<div class="btns">
<button id="check" data-i="check"></button>
<button id="show" class="sec" data-i="show"></button>
<button id="reset" class="sec" data-i="reset"></button>
</div>
<div id="score" aria-live="polite"></div>
<section id="original"><h2 data-i="orig"></h2><div class="row" id="origRow"></div></section>
</main>
<footer data-i="foot"></footer>
<script>
const T={
de:{title:'Mobiltelefone sortieren | ODCE',t1:'Mobiltelefone',t2:'sortieren',lead:'Bringen Sie die Geräte in die zeitlich richtige Reihenfolge, vom ältesten links zum neuesten rechts.',task:'Ziehen Sie die Bilder per Drag & Drop. Auf Tablet/Smartphone: zwei Geräte nacheinander antippen, um sie zu tauschen. Tastatur: Tab, dann Enter zum Auswählen/Tauschen.',old:'alt',new:'neu',check:'Prüfen',show:'Originalreihenfolge zeigen',reset:'Neu mischen',orig:'Originalreihenfolge',foot:'ODCE · Technische Universität Hamburg',alt:'Mobiltelefon',perfect:n=>'Perfekt: alle '+n+' Geräte korrekt platziert.',part:(k,n)=>k+' von '+n+' Geräten an der richtigen Position.'},
en:{title:'Sort the Mobile Phones | ODCE',t1:'Sort the',t2:'mobile phones',lead:'Arrange the devices in chronological order, from oldest on the left to newest on the right.',task:'Drag and drop the pictures. On tablet/phone: tap two devices one after the other to swap them. Keyboard: Tab, then Enter to select/swap.',old:'old',new:'new',check:'Check',show:'Show original order',reset:'Shuffle again',orig:'Original order',foot:'ODCE · Hamburg University of Technology',alt:'Mobile phone',perfect:n=>'Perfect: all '+n+' devices placed correctly.',part:(k,n)=>k+' of '+n+' devices in the correct position.'}};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'de',lastScore=null;
function setLang(l){lang=l;document.documentElement.lang=l;document.title=T[l].title;
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
document.querySelector('h1 [data-i="t1"]').style.color=l==='de'?'#000':'';document.querySelector('h1 [data-i="t2"]').style.color='var(--t)';
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===l));
document.querySelectorAll('.card img').forEach(i=>i.alt=T[l].alt);renderScore()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.set));
// Chronologische Reihenfolge / chronological order (edit here)
const IMAGES=['pic1','pic2','pic3','pic4','pic5','pic6','pic7','pic9','pic11','pic12','pic13','pic14','pic15','pic16'].map(p=>'pics/'+p+'.jpg');
const row=document.getElementById('row'),score=document.getElementById('score');
let dragged=null,selected=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function card(src,label){const d=document.createElement('div');d.className='card';d.dataset.src=src;
const i=document.createElement('img');i.src=src;i.alt=T[lang].alt;d.appendChild(i);
const n=document.createElement('span');n.className='n';n.textContent=label||'';d.appendChild(n);return d}
function renderScore(){if(lastScore===null){score.textContent='';return}
score.textContent=lastScore===IMAGES.length?T[lang].perfect(lastScore):T[lang].part(lastScore,IMAGES.length)}
function clearMarks(){row.querySelectorAll('.card').forEach(c=>c.classList.remove('ok','no'));lastScore=null;renderScore()}
function swap(a,b){const t=document.createElement('div');a.before(t);b.before(a);t.replaceWith(b)}
function build(){row.innerHTML='';let s;do{s=shuffle(IMAGES)}while(s.join()===IMAGES.join());
s.forEach(src=>{const c=card(src);c.draggable=true;c.tabIndex=0;c.setAttribute('role','button');row.appendChild(c)});clearMarks()}
row.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragged=c;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')});
row.addEventListener('dragend',()=>{dragged&&dragged.classList.remove('drag');dragged=null});
row.addEventListener('dragover',e=>{e.preventDefault();const c=e.target.closest('.card');if(!c||!dragged||c===dragged)return;
const r=c.getBoundingClientRect();row.insertBefore(dragged,e.clientX>r.left+r.width/2?c.nextSibling:c);clearMarks()});
row.addEventListener('drop',e=>e.preventDefault());
function pick(c){if(!selected){selected=c;c.classList.add('sel');return}
if(selected!==c){swap(selected,c);clearMarks()}selected.classList.remove('sel');selected=null}
row.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(c)});
row.addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(c)}});
document.getElementById('check').onclick=()=>{let ok=0;[...row.children].forEach((c,i)=>{const r=c.dataset.src===IMAGES[i];ok+=r;c.classList.toggle('ok',r);c.classList.toggle('no',!r)});lastScore=ok;renderScore()};
document.getElementById('show').onclick=()=>{const o=document.getElementById('origRow');document.getElementById('original').style.display='block';
if(!o.children.length)IMAGES.forEach((s,i)=>o.appendChild(card(s,i+1)))};
document.getElementById('reset').onclick=()=>{build();document.getElementById('original').style.display='none'};
setLang(lang);build();
</script>
</body>
</html>
